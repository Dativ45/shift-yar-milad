name: Build Milad APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: \'3.22.0\'
          channel: \'stable\'
      - name: Fix project structure
        run: |
          cp pubspec.yaml /tmp/pubspec.backup
          cp -r lib /tmp/lib_backup
          flutter create . --project-name shift_yar_milad --org com.milad.shiftyar --platforms android
          cp /tmp/pubspec.backup pubspec.yaml
          rm -rf lib
          cp -r /tmp/lib_backup lib
          flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: shift-yar-milad-APK
          path: build/app/outputs/flutter-apk/app-release.apk
